<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini HR App</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; font-family: "Noto Sans Thai", system-ui, sans-serif;
    color: #1a1a1a; background: linear-gradient(145deg, #fff8f0, #ffe2c2);
  }
  main {
    width: min(100%, 520px); padding: 32px; border-radius: 20px;
    background: #fff; box-shadow: 0 16px 50px rgba(91, 42, 5, 0.12);
  }
  h1 { margin: 0 0 8px; color: #d4550a; }
  p { margin: 0 0 20px; line-height: 1.7; color: #555; }
  .status {
    padding: 14px; border-radius: 10px; color: #176b32; background: #eaf8ee;
    font-weight: 700;
  }
</style>
</head>
<body>
<main>
  <h1>Mini HR App</h1>
  <p>ระบบลงเวลา ลางาน ขอ OT ดูยอด และจัดการงาน HR ผ่าน LINE</p>
  <div class="status">ระบบพร้อมใช้งาน กรุณาเปิดเมนูผ่าน LINE Official Account</div>
</main>
</body>
</html>
