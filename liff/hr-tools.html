<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>เครื่องมือ HR — Mini HR App</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans Thai', system-ui, sans-serif; background: #FFF8F0; color: #1A1A1A; }
  .header {
    background: linear-gradient(135deg, #1A1A1A, #2A1A0A); color: #fff;
    padding: 20px 16px; position: sticky; top: 0; z-index: 10;
  }
  .header h1 { font-size: 20px; }

  .tabs {
    display: flex; overflow-x: auto; background: #fff; border-bottom: 1px solid #E0D0C0;
    position: sticky; top: 64px; z-index: 9;
  }
  .tab {
    flex: 0 0 auto; padding: 12px 16px; font-size: 13px; font-weight: 600;
    color: #777; cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tab.active { color: #D4550A; border-color: #D4550A; }

  .content { padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: #fff; padding: 14px; border-radius: 10px; margin-bottom: 10px;
  }
  .card .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .card .row .lab { color: #777; }

  .emp-item {
    background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 8px;
    border-left: 4px solid #F28C28;
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  }
  .emp-item .name { font-weight: 700; font-size: 15px; }
  .emp-item .meta { font-size: 12px; color: #777; margin-top: 2px; }
  .emp-edit-btn {
    width: auto; min-width: 76px; margin: 0; padding: 9px 12px;
    border-radius: 999px; font-size: 13px;
  }

  .btn {
    background: #D4550A; color: #fff; border: none; padding: 12px 16px;
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    margin-bottom: 10px; width: 100%;
  }
  .btn-secondary {
    background: #fff; color: #D4550A; border: 2px solid #D4550A;
  }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 100; padding: 20px; overflow: auto;
  }
  .modal-bg.show { display: block; }
  .modal {
    background: #fff; padding: 20px; border-radius: 14px; max-width: 500px;
    margin: 50px auto;
  }
  .field { margin-bottom: 10px; }
  .field label { font-size: 12px; color: #777; display: block; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 6px; font-size: 14px;
  }
  .field .hint { color: #777; font-size: 11px; line-height: 1.5; margin-top: 4px; }

  .loading-state, .empty-state {
    text-align: center; padding: 40px; color: #999;
  }
  .popup-backdrop {
    position: fixed; inset: 0; z-index: 10000; display: none;
    align-items: center; justify-content: center; padding: 18px;
    background: rgba(0, 0, 0, 0.42);
  }
  .popup-backdrop.show { display: flex; }
  .popup {
    width: 100%; max-width: 340px; background: #fff; border-radius: 18px;
    padding: 22px; text-align: center; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
  }
  .popup-icon {
    width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%;
    display: grid; place-items: center; background: #E9F8E9; color: #1F7A1F;
  }
  .popup-icon .material-symbols-rounded { font-size: 32px; }
  .popup-title { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
  .popup-message { color: #666; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
  .popup-ok {
    width: 100%; background: #D4550A; color: #fff; border: none;
    border-radius: 10px; padding: 12px 14px; font-family: inherit;
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
</style>
</head>
<body>
<div class="header">
  <h1>🛠️ เครื่องมือ HR</h1>
</div>

<div class="tabs">
  <div class="tab active" data-tab="employees">👥 พนักงาน</div>
  <div class="tab" data-tab="payitems">💵 เพิ่ม/หัก</div>
  <div class="tab" data-tab="quota">📊 โควต้าลา</div>
  <div class="tab" data-tab="holidays">📅 วันหยุด</div>
  <div class="tab" data-tab="report">📈 รายงาน</div>
</div>

<div class="content">

  <div class="panel active" id="panel-employees">
    <button class="btn" id="btnAddEmp">+ เพิ่มพนักงาน</button>
    <div id="empList" class="loading-state">กำลังโหลด...</div>
  </div>

  <div class="panel" id="panel-payitems">
    <button class="btn" id="btnAddPayItem">+ เพิ่มรายการ</button>
    <div class="field">
      <label>งวด</label>
      <input type="month" id="payPeriod">
    </div>
    <div id="payList" class="loading-state">เลือกงวดก่อน...</div>
  </div>

  <div class="panel" id="panel-quota">
    <div class="field"><label>ปี</label><input type="number" id="quotaYear" min="2024" max="2030"></div>
    <div id="quotaList" class="loading-state">กำลังโหลด...</div>
  </div>

  <div class="panel" id="panel-holidays">
    <button class="btn" id="btnAddHoliday">+ เพิ่มวันหยุด</button>
    <div id="holidayList" class="loading-state">กำลังโหลด...</div>
  </div>

  <div class="panel" id="panel-report">
    <div class="field"><label>งวด</label><input type="month" id="reportPeriod"></div>
    <button class="btn" id="btnGenReport">สร้างรายงาน</button>
    <button class="btn btn-secondary" id="btnClosePeriod">📦 ปิดงวด + คำนวณ Payroll</button>
    <div id="reportList" class="empty-state">เลือกงวดและกดสร้างรายงาน</div>
  </div>

</div>

<!-- Edit Employee Modal -->
<div class="modal-bg" id="empModal">
  <div class="modal">
    <h2 id="empModalTitle">แก้ไขพนักงาน</h2>
    <div class="field"><label>รหัส</label><input id="empId" readonly></div>
    <div class="field">
      <label>LINE User ID</label>
      <input id="empLineUserId" placeholder="Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
      <div class="hint">ใช้เมื่อพนักงานเปลี่ยนบัญชี LINE ใหม่ ห้ามใช้ซ้ำกับพนักงานคนอื่น</div>
    </div>
    <div class="field"><label>ชื่อ-นามสกุล</label><input id="empName"></div>
    <div class="field"><label>เบอร์โทร</label><input id="empPhone"></div>
    <div class="field"><label>แผนก</label><input id="empDept"></div>
    <div class="field"><label>ตำแหน่ง</label><input id="empPosition"></div>
    <div class="field"><label>ค่าจ้าง/เดือน</label><input id="empBasePay" type="number"></div>
    <div class="field"><label>ค่า OT/ชม.</label><input id="empOtRate" type="number"></div>
    <div class="field"><label>ผู้อนุมัติ L1</label><select id="empApprover1"></select></div>
    <div class="field"><label>สิทธิ์ระบบ</label>
      <select id="empRole">
        <option value="employee">พนักงาน</option>
        <option value="approver">ผู้อนุมัติ</option>
        <option value="hr">HR</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="field"><label>สถานะ</label>
      <select id="empActive">
        <option value="true">ใช้งาน</option>
        <option value="false">ไม่ใช้งาน</option>
      </select>
    </div>
    <button class="btn" id="btnSaveEmp">บันทึก</button>
    <button class="btn btn-secondary" onclick="document.getElementById('empModal').classList.remove('show')">ยกเลิก</button>
  </div>
</div>

<div class="popup-backdrop" id="successPopup" role="dialog" aria-modal="true" aria-labelledby="successPopupTitle">
  <div class="popup">
    <div class="popup-icon"><span class="material-symbols-rounded" aria-hidden="true">check_circle</span></div>
    <div class="popup-title" id="successPopupTitle">บันทึกสำเร็จ</div>
    <div class="popup-message" id="successPopupMessage">ดำเนินการเรียบร้อย</div>
    <button class="popup-ok" id="successPopupOk" type="button">ตกลง</button>
  </div>
</div>

<script>
  const LIFF_ID = '<?= LIFF_ID ?>';
  const APPS_SCRIPT_URL = '<?= SCRIPT_URL ?>';
  let userId = null;
  let employeesCache = [];

  document.getElementById('successPopupOk').onclick = hideSuccessPopup;
  document.getElementById('successPopup').onclick = function(e) {
    if (e.target.id === 'successPopup') hideSuccessPopup();
  };

  (async function init() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) liff.login();
    const profile = await liff.getProfile();
    userId = profile.userId;
    setupTabs();
    loadEmployees();
    // Default to current month
    const today = new Date();
    const period = today.toISOString().substring(0, 7);
    document.getElementById('payPeriod').value = period;
    document.getElementById('reportPeriod').value = period;
    document.getElementById('quotaYear').value = today.getFullYear();
    loadQuotas();
    loadHolidays();
  })();

  function setupTabs() {
    document.querySelectorAll('.tab').forEach(function(t) {
      t.onclick = function() {
        document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function(x) { x.classList.remove('active'); });
        t.classList.add('active');
        document.getElementById('panel-' + t.dataset.tab).classList.add('active');
        if (t.dataset.tab === 'payitems') loadPayItems();
        if (t.dataset.tab === 'quota') loadQuotas();
        if (t.dataset.tab === 'holidays') loadHolidays();
      };
    });
  }

  async function api(action, data) {
    data = data || {};
    data.action = action;
    data.lineUserId = userId;
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    });
    return await res.json();
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  // ==================== EMPLOYEES ====================
  async function loadEmployees() {
    const r = await api('hr_employees');
    if (!r.ok) { document.getElementById('empList').textContent = 'Error: ' + r.error; return; }
    employeesCache = r.employees;
    renderEmployees();
  }

  function renderEmployees() {
    const el = document.getElementById('empList');
    if (employeesCache.length === 0) { el.textContent = 'ยังไม่มีพนักงาน'; return; }
    el.className = '';
    el.innerHTML = '';
    employeesCache.forEach(function(emp) {
      const item = document.createElement('div');
      item.className = 'emp-item';
      const info = document.createElement('div');
      info.className = 'emp-main';
      info.innerHTML =
        '<div class="name">' + escapeHtml(emp.display_name) + ' (' + escapeHtml(emp.employee_id) + ')</div>' +
        '<div class="meta">' + escapeHtml(emp.department || '-') + ' · ' + escapeHtml(emp.position || '-') +
        ' · ' + (emp.is_active ? 'ใช้งาน' : 'ไม่ใช้งาน') + '</div>';
      const editBtn = document.createElement('button');
      editBtn.className = 'btn emp-edit-btn';
      editBtn.type = 'button';
      editBtn.textContent = 'แก้ไข';
      editBtn.onclick = function() { openEmpModal(emp); };
      item.appendChild(info);
      item.appendChild(editBtn);
      el.appendChild(item);
    });
  }

  function openEmpModal(emp) {
    document.getElementById('empModalTitle').textContent = 'แก้ไข: ' + emp.display_name;
    document.getElementById('empId').value = emp.employee_id;
    document.getElementById('empLineUserId').value = emp.line_user_id || '';
    document.getElementById('empName').value = emp.display_name || '';
    document.getElementById('empPhone').value = emp.phone || '';
    document.getElementById('empDept').value = emp.department || '';
    document.getElementById('empPosition').value = emp.position || '';
    document.getElementById('empBasePay').value = emp.base_pay_monthly || 0;
    document.getElementById('empOtRate').value = emp.ot_rate_per_hour || 0;

    const sel = document.getElementById('empApprover1');
    sel.innerHTML = '<option value="">-- ไม่มี --</option>';
    employeesCache.filter(function(e) { return e.employee_id !== emp.employee_id; })
      .forEach(function(e) {
        const opt = document.createElement('option');
        opt.value = e.employee_id;
        opt.textContent = e.display_name + ' (' + e.employee_id + ')';
        if (emp.approver_L1_id === e.employee_id) opt.selected = true;
        sel.appendChild(opt);
      });
    document.getElementById('empRole').value = emp.role || 'employee';
    document.getElementById('empActive').value = emp.is_active ? 'true' : 'false';
    document.getElementById('empModal').classList.add('show');
  }

  document.getElementById('btnSaveEmp').onclick = async function() {
    const empId = document.getElementById('empId').value;
    const updates = {
      line_user_id: document.getElementById('empLineUserId').value.trim(),
      display_name: document.getElementById('empName').value,
      phone: document.getElementById('empPhone').value,
      department: document.getElementById('empDept').value,
      position: document.getElementById('empPosition').value,
      base_pay_monthly: Number(document.getElementById('empBasePay').value || 0),
      ot_rate_per_hour: Number(document.getElementById('empOtRate').value || 0),
      approver_L1_id: document.getElementById('empApprover1').value,
      role: document.getElementById('empRole').value,
      is_active: document.getElementById('empActive').value === 'true'
    };
    const r = await api('hr_update_emp', { employeeId: empId, updates: updates });
    if (r.ok) {
      document.getElementById('empModal').classList.remove('show');
      loadEmployees();
      showSuccessPopup('บันทึกสำเร็จ', 'บันทึกข้อมูลพนักงานเรียบร้อย');
    } else {
      alert('Error: ' + r.error);
    }
  };

  document.getElementById('btnAddEmp').onclick = async function() {
    const lineUserId = prompt('LINE User ID ของพนักงาน:');
    if (!lineUserId) return;
    const displayName = prompt('ชื่อ-นามสกุล:');
    if (!displayName) return;
    const phone = prompt('เบอร์โทร:') || '';
    const r = await api('hr_add_emp', {
      employee: { line_user_id: lineUserId.trim(), display_name: displayName.trim(), phone: phone.trim() }
    });
    if (r.ok) {
      loadEmployees();
      loadQuotas();
      showSuccessPopup('เพิ่มพนักงานสำเร็จ', 'รหัสพนักงาน ' + r.employeeId);
    } else {
      alert('เพิ่มพนักงานไม่สำเร็จ: ' + r.error);
    }
  };

  // ==================== PAY ITEMS ====================
  document.getElementById('payPeriod').onchange = loadPayItems;
  async function loadPayItems() {
    const period = document.getElementById('payPeriod').value;
    if (!period) return;
    const r = await api('hr_pay_items', { period: period });
    const el = document.getElementById('payList');
    el.className = '';
    if (!r.ok) { el.textContent = 'Error'; return; }
    if (r.items.length === 0) { el.textContent = 'ยังไม่มีรายการ'; return; }
    el.innerHTML = r.items.map(function(i) {
      return '<div class="card">' +
        '<div class="row"><span class="lab">พนักงาน</span><span>' + (i.employee_id || 'ทุกคน') + '</span></div>' +
        '<div class="row"><span class="lab">ประเภท</span><span>' + (i.type === 'bonus' ? '✅ เพิ่ม' : '❌ หัก') + '</span></div>' +
        '<div class="row"><span class="lab">จำนวน</span><span>' + Number(i.amount).toLocaleString() + ' บาท</span></div>' +
        '<div class="row"><span class="lab">เหตุผล</span><span>' + (i.reason || '-') + '</span></div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('btnAddPayItem').onclick = async function() {
    const empId = prompt('Employee ID (เว้นว่าง = ทุกคน):');
    const type = prompt('ประเภท (bonus/deduction):');
    const amount = prompt('จำนวน (บาท):');
    const reason = prompt('เหตุผล:');
    const period = document.getElementById('payPeriod').value;
    if (!type || !amount) return;
    const r = await api('hr_add_payitem', {
      item: {
        employee_id: empId || '',
        period: period,
        type: type,
        amount: Number(amount),
        reason: reason
      }
    });
    if (r.ok) { loadPayItems(); showSuccessPopup('เพิ่มรายการสำเร็จ', 'เพิ่มรายการเพิ่ม/หักเรียบร้อย'); }
    else alert('Error');
  };

  // ==================== LEAVE QUOTAS ====================
  document.getElementById('quotaYear').onchange = loadQuotas;

  async function loadQuotas() {
    const year = Number(document.getElementById('quotaYear').value);
    if (!year) return;
    const r = await api('hr_leave_quotas', { year: year });
    const el = document.getElementById('quotaList');
    el.className = '';
    if (!r.ok) { el.textContent = 'Error: ' + r.error; return; }
    if (r.quotas.length === 0) { el.textContent = 'ยังไม่มีพนักงาน'; return; }
    el.innerHTML = '';
    r.quotas.forEach(function(q) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="row"><strong>' + escapeHtml(q.name) + '</strong><span>' + escapeHtml(q.employee_id) + '</span></div>' +
        '<div class="row"><span class="lab">ลาป่วย</span><span>' + q.sick_used + ' / ' + q.sick_quota + ' วัน</span></div>' +
        '<div class="row"><span class="lab">ลากิจ</span><span>' + q.personal_used + ' / ' + q.personal_quota + ' วัน</span></div>' +
        '<div class="row"><span class="lab">พักร้อน</span><span>' + q.vacation_used + ' / ' + q.vacation_quota + ' วัน</span></div>';
      const button = document.createElement('button');
      button.className = 'btn btn-secondary';
      button.textContent = 'แก้ไขโควตา';
      button.onclick = function() { editQuota(q, year); };
      card.appendChild(button);
      el.appendChild(card);
    });
  }

  async function editQuota(q, year) {
    const sick = prompt('โควตาลาป่วย (วัน):', q.sick_quota);
    if (sick === null) return;
    const personal = prompt('โควตาลากิจ (วัน):', q.personal_quota);
    if (personal === null) return;
    const vacation = prompt('โควตาพักร้อน (วัน):', q.vacation_quota);
    if (vacation === null) return;
    const r = await api('hr_set_quota', {
      employeeId: q.employee_id,
      year: year,
      updates: { sick_quota: Number(sick), personal_quota: Number(personal), vacation_quota: Number(vacation) }
    });
    if (r.ok) { loadQuotas(); showSuccessPopup('บันทึกสำเร็จ', 'บันทึกโควตาลาเรียบร้อย'); }
    else alert('บันทึกไม่สำเร็จ: ' + r.error);
  }

  // ==================== HOLIDAYS ====================
  async function loadHolidays() {
    const r = await api('hr_holidays');
    const el = document.getElementById('holidayList');
    el.className = '';
    if (!r.ok) { el.textContent = 'Error: ' + r.error; return; }
    if (r.holidays.length === 0) { el.textContent = 'ยังไม่มีวันหยุด'; return; }
    el.innerHTML = r.holidays.map(function(h) {
      const date = h.date ? String(h.date).substring(0, 10) : '-';
      return '<div class="card"><div class="row"><strong>' + escapeHtml(h.name) +
        '</strong><span>' + escapeHtml(date) + '</span></div>' +
        '<div class="row"><span class="lab">ประเภท</span><span>' + escapeHtml(h.type || 'company') + '</span></div></div>';
    }).join('');
  }

  document.getElementById('btnAddHoliday').onclick = async function() {
    const date = prompt('วันที่หยุด (YYYY-MM-DD):');
    if (!date) return;
    const name = prompt('ชื่อวันหยุด:');
    if (!name) return;
    const type = prompt('ประเภท (public/company):', 'public') || 'company';
    const r = await api('hr_add_holiday', { holiday: { date: date.trim(), name: name.trim(), type: type.trim() } });
    if (r.ok) { loadHolidays(); showSuccessPopup('เพิ่มวันหยุดสำเร็จ', 'เพิ่มวันหยุดเรียบร้อย'); }
    else alert('เพิ่มวันหยุดไม่สำเร็จ: ' + r.error);
  };

  // ==================== REPORT ====================
  document.getElementById('btnGenReport').onclick = async function() {
    const period = document.getElementById('reportPeriod').value;
    const r = await api('hr_report', { period: period });
    const el = document.getElementById('reportList');
    el.className = '';
    if (!r.ok) { el.textContent = 'Error'; return; }
    el.innerHTML = '<div class="card"><h3>งวด ' + r.period + '</h3></div>' +
      r.report.map(function(row) {
        return '<div class="card">' +
          '<div class="row"><span class="lab">' + row.name + '</span><span>' + row.employee_id + '</span></div>' +
          '<div class="row"><span class="lab">วันทำงาน</span><span>' + row.work_days + ' วัน</span></div>' +
          '<div class="row"><span class="lab">OT</span><span>' + row.ot_hours + ' ชม.</span></div>' +
          '<div class="row"><span class="lab">เพิ่ม</span><span>+' + Number(row.bonus).toLocaleString() + '</span></div>' +
          '<div class="row"><span class="lab">หัก</span><span>-' + Number(row.deduction).toLocaleString() + '</span></div>' +
          '</div>';
      }).join('');
  };

  document.getElementById('btnClosePeriod').onclick = async function() {
    const period = document.getElementById('reportPeriod').value;
    if (!confirm('ยืนยันการปิดงวด ' + period + ' ?\n\nระบบจะคำนวณยอดและสร้าง Payment records')) return;
    const r = await api('close_period', { period: period });
    if (r.ok) {
      showSuccessPopup(
        'ปิดงวดสำเร็จ',
        'สร้างรายการ ' + r.count + ' รายการ รวม ' + Number(r.totalSum).toLocaleString() + ' บาท'
      );
    } else if (r.error === 'has_pending') {
      if (confirm('มีคำขอค้าง: ' + r.pendingLeaves + ' ลา + ' + r.pendingOT + ' OT\n\nต้องการปิดงวดต่อ?')) {
        const r2 = await api('close_period', { period: period, force: true });
        if (r2.ok) showSuccessPopup('ปิดงวดสำเร็จ', 'ปิดงวดเรียบร้อยแบบบังคับปิด');
        else alert('Error: ' + r2.error);
      }
    } else {
      alert('Error: ' + r.error);
    }
  };

  function showSuccessPopup(title, message) {
    document.getElementById('successPopupTitle').textContent = title || 'บันทึกสำเร็จ';
    document.getElementById('successPopupMessage').textContent = message || 'ดำเนินการเรียบร้อย';
    document.getElementById('successPopup').classList.add('show');
  }

  function hideSuccessPopup() {
    document.getElementById('successPopup').classList.remove('show');
  }

</script>
</body>
</html>
